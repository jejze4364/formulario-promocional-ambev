<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso Negado</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8d7da;
      color: #721c24;
      text-align: center;
      padding: 50px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      border: 1px solid #f5c6cb;
    }
    h1 {
      color: #721c24;
    }
    p {
      font-size: 18px;
      line-height: 1.5;
    }
    .back-button {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #f5c6cb;
      color: #721c24;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
    }
    .back-button:hover {
      background-color: #f1b0b7;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Acesso Negado</h1>
    <p>Desculpe, mas você precisa ter mais de 18 anos para acessar este site.</p>
    <p>Por favor, volte quando for maior de idade!</p>
    <a href="https://google.com" class="back-button">Voltar</a>
  </div>
</body>
</html>
