<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bud Zero - Estilo e Moderação</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(45deg, #fff8f9, #d00707); /* Vermelho e bege */
      color: #fff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    #result-container {
      max-width: 600px;
      padding: 30px;
      background: #ffffff;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    h1 {
      color: #d00707;
      font-size: 2.5rem;
      margin-bottom: 20px;
      font-weight: bold;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 30px;
      color: #444;
    }

    form {
      text-align: left;
    }

    label {
      display: block;
      font-size: 1rem;
      margin-bottom: 5px;
      color: #444;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1rem;
    }

    button {
      background-color: #d00707;
      color: #fff;
      border: none;
      padding: 15px 30px;
      font-size: 1.1rem;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }

    button:hover {
      background-color: #d00707;
    }
  </style>
</head>
<body>
  <div id="result-container">
    <h1>Bud Zero - Estilo e Moderação</h1>
    <p>
      Com Bud Zero, aproveite o sabor inconfundível da Budweiser, com leveza e equilíbrio, ideal para qualquer ocasião.
    </p>
    <form id="contact-form">
      <button type="submit">QUERO MAIS PROMOÇÕES DE BUDZERO</button>
    </form>

    <button style="margin-top: 20px;" onclick="window.location.href='index.html'">Refazer Pesquisa</button>
  </div>

  <script>
    // Manipula o envio do formulário
    document.getElementById('contact-form').addEventListener('submit', function(event) {
      event.preventDefault();

      event.preventDefault(); // Impede o envio normal do formulário
     // Aqui você pode incluir qualquer lógica adicional antes do envio para o PHP
      alert("INTERESSE REGISTRADO!");
    // O formulário será enviado ao PHP para processamento
      this.submit(); // Submete o formulário para o PHP
    });
  </script>

</body>
</html>
